<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BEBA FASHION | Official Telegram Shop</title>
  
  <!-- Open Graph / Meta Preview for TikTok & Social Browsers -->
  <meta property="og:title" content="BEBA FASHION - Shop Online" />
  <meta property="og:description" content="Click to open the Beba Fashion shop directly in Telegram." />
  <meta property="og:type" content="website" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      border-radius: 20px;
      font-size: 34px;
      margin-bottom: 20px;
      box-shadow: 0 10px 20px rgba(236, 72, 153, 0.35);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #ffffff;
      text-transform: uppercase;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      padding: 16px 24px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }
    .btn:active {
      transform: scale(0.98);
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }
    .btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 6px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-note {
      margin-top: 18px;
      font-size: 13px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .footer-instructions {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }
    .footer-instructions strong {
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">🛍️</div>
    <h1>BEBA FASHION</h1>
    <p class="subtitle">Opening our Telegram Mini App so you can browse, order, and get fast delivery directly.</p>

    <a id="open-btn" class="btn" href="#">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.52 2.77-1.16 3.35-1.36 3.73-1.37.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
      </svg>
      <span>Open Beba Shop</span>
    </a>

    <div class="status-note" id="status-text">
      <span>Redirecting to Telegram</span>
      <span class="spinner"></span>
    </div>

    <div class="footer-instructions">
      If the app does not open automatically, tap the button above or tap <strong>•••</strong> in the top-right corner of TikTok and select <strong>"Open in Browser"</strong>.
    </div>
  </div>

  <script>
    const BOT_USERNAME = "Beba_Fashionbot";
    const APP_NAME = "Beba_Shop";
    const START_PARAM = "tiktok";

    // 1. Direct custom URI scheme for Telegram Mini App
    const tgScheme = `tg://resolve?domain=${BOT_USERNAME}&appname=${APP_NAME}&startapp=${START_PARAM}`;
    
    // 2. Fallback Web Universal link
    const webFallback = `https://t.me/${BOT_USERNAME}/${APP_NAME}?startapp=${START_PARAM}`;

    // 3. Android Intent package call
    const isAndroid = /Android/i.test(navigator.userAgent);
    const androidIntent = `intent://resolve?domain=${BOT_USERNAME}&appname=${APP_NAME}&startapp=${START_PARAM}#Intent;package=org.telegram.messenger;scheme=tg;S.browser_fallback_url=${encodeURIComponent(webFallback)};end`;

    const targetUrl = isAndroid ? androidIntent : tgScheme;
    const btn = document.getElementById("open-btn");
    const statusText = document.getElementById("status-text");

    // Set button target
    btn.href = targetUrl;

    // Handle manual tap
    btn.addEventListener("click", function(e) {
      setTimeout(() => {
        window.location.href = webFallback;
      }, 1500);
    });

    // Auto-redirect execution
    window.addEventListener("DOMContentLoaded", () => {
      // Small 250ms delay to let the browser initialize properly
      setTimeout(() => {
        if (isAndroid) {
          window.location.href = androidIntent;
        } else {
          window.location.href = tgScheme;
        }

        // After 2.5s update indicator to manual mode if user is still on this screen
        setTimeout(() => {
          if (statusText) {
            statusText.innerHTML = "<span>Tap the button above to launch</span>";
          }
        }, 2500);
      }, 250);
    });
  </script>
</body>
</html>
